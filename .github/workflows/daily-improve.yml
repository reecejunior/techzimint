name: Daily Improve

# Runs every morning and, if it finds one worthwhile improvement — a fix OR a
# modest new/enhanced feature — opens a pull request from a daily-improve/<something>
# branch. It NEVER merges its own PR — a human (Tanatswa) reviews and merges on GitHub.
#
# Setup required before this works:
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. CLAUDE_CODE_OAUTH_TOKEN secret already added.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You maintain this codebase, the source for startups.techzim.co.zw —
            a public directory/leaderboard of Zimbabwean and African startups.

            First, check whether a daily-improve proposal is already pending:
              git fetch origin
              git branch -r --list 'origin/daily-improve/*'
            For any such branch, check if it's already merged into main with:
              git merge-base --is-ancestor origin/<branch> origin/main
            If any daily-improve/* branch exists and is NOT yet merged into main,
            stop here and do nothing else — only one proposal should be open at a time.

            Otherwise, look for exactly ONE worthwhile improvement to make today.
            You have two kinds of candidates to consider, and either is fair game:

            A) Fixes and quality improvements (as before): a real bug fix, a
               missing null/undefined check, a small type-safety fix, removing
               dead code, fixing a broken link or typo, tightening an overly
               loose eslint/tsconfig rule that's actually safe, or a small
               readability refactor.

            B) Small, genuinely useful features or UX improvements to the site
               itself: a missing filter/sort/search option on a listing page,
               a helpful empty-state or loading-state, a small but clearly
               valuable addition to an existing component (e.g. a share button,
               copy-link button, better mobile layout for an existing view),
               an accessibility improvement, or completing something that's
               obviously half-implemented.

            Either way, keep it to ONE well-scoped, fully-working change that a
            human can review in a few minutes — not a half-started multi-file
            overhaul, not a new page, not a redesign, and nothing that requires
            a product/business decision only a human should make (pricing,
            copy/branding decisions, new third-party integrations or API keys,
            anything touching auth, payments, or data deletion). When in doubt,
            prefer the smaller, safer version of an idea over the more ambitious
            one. If you can't find anything worth proposing, do nothing and
            exit — do not open a trivial or empty PR just to have something
            to show.

            If you do find something:
              1. Create a new branch named daily-improve/<short-kebab-description>
              2. Make the change, keeping the diff minimal and focused — for a
                 feature, that means one complete, working slice, not scaffolding
                 for something bigger.
              3. Set a git identity if needed:
                 git config user.name "claude[bot]"
                 git config user.email "claude[bot]@users.noreply.github.com"
              4. Commit with a clear message: what changed and why
              5. Push the branch:
                 git push origin daily-improve/<short-kebab-description>
              6. Open a pull request against main using the gh CLI, e.g.:
                 gh pr create --base main --head daily-improve/<short-kebab-description> \
                   --title "<clear, specific title>" \
                   --body "<what changed, why it's useful, why it's low-risk,
                   and — if it's a new feature — a one-line note on how you
                   tested/verified it works>"
              7. Do NOT merge the pull request yourself, under any circumstances.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 50
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob"
